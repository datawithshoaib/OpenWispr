[package]
name = "openwispr"
version = "0.1.0"
edition = "2024"
description = "Lightweight, local, push-to-talk dictation powered by Whisper"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
hound = "3.5.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
whisper-rs = "0.16.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Media_Audio",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
